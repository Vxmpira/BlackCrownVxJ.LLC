<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Collective is now Eclipse-X | BlackCrown</title>
<meta name="description" content="Eclipse-X is the free BlackCrown community for independent operators in trading, AI, and ecommerce. No gurus, no courses, just the room. Open invite.">
<link rel="canonical" href="https://blackcrownvxj.com/collective.html">
<meta property="og:title" content="The Collective is now Eclipse-X">
<meta property="og:description" content="Same room, same signal, new name. Join Eclipse-X free on Discord.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://blackcrownvxj.com/collective.html">
<meta property="og:image" content="https://blackcrownvxj.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://blackcrownvxj.com/og-image.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--vanta:#000;--ink-2:#060608;--white:#fff;--bone:#E8E8EF;--mute:#85838F;--pink:#FF2D95;--pink-soft:#FF6FB6;
    --line:rgba(255,45,149,.2);--line-soft:rgba(255,255,255,.07);
    --glow-pink:0 0 6px rgba(255,45,149,.36),0 0 18px rgba(255,45,149,.16);--glow-white:0 0 8px rgba(255,255,255,.24)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--vanta);color:var(--bone);font-family:'Manrope',system-ui,sans-serif;font-size:17px;line-height:1.65;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit}
  ::selection{background:var(--pink);color:#0A0008}
  .aura{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);width:60vw;max-width:620px;height:60vw;max-height:620px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,45,149,.12),transparent 66%);filter:blur(60px);pointer-events:none}
  .card{position:relative;max-width:560px;text-align:center}
  .crown{filter:drop-shadow(0 0 8px rgba(255,45,149,.7));margin-bottom:1.6rem}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--pink);
    text-shadow:var(--glow-pink);display:block;margin-bottom:1rem}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(2rem,7vw,3.2rem);line-height:1.02;letter-spacing:-0.02em;
    color:var(--white);text-shadow:var(--glow-white);margin-bottom:1.2rem}
  h1 em{font-style:normal;color:var(--pink);text-shadow:var(--glow-pink)}
  p{color:var(--mute);max-width:44ch;margin:0 auto 2rem}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
    padding:.85rem 1.6rem;border-radius:8px;display:inline-block;text-decoration:none;transition:transform .2s ease,box-shadow .25s ease,background .25s ease}
  .btn.solid{background:var(--pink);color:#0A0008;border:1px solid var(--pink);box-shadow:var(--glow-pink)}
  .btn.solid:hover{background:var(--pink-soft);transform:translateY(-2px)}
  .btn.ghost{background:transparent;color:var(--bone);border:1px solid rgba(255,255,255,.22);margin-left:.6rem}
  .btn.ghost:hover{border-color:var(--pink);color:var(--pink);box-shadow:var(--glow-pink);transform:translateY(-2px)}
  .foot{margin-top:3rem;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="aura"></div>
<main class="card">
  <svg class="crown" width="54" height="45" viewBox="0 0 36 30" fill="none" stroke="#FF2D95" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
    <path d="M4 24 L4 9 L12 16 L18 5 L24 16 L32 9 L32 24 Z"/>
    <line x1="7" y1="28" x2="29" y2="28"/>
  </svg>
  <span class="eyebrow">A new name, the same room</span>
  <h1>The Collective is now <em>Eclipse-X</em>.</h1>
  <p>BlackCrown's network of independent operators carries on under its new name. Traders, founders and builders, trading real signal through every session. Free to join, no upsell.</p>
  <div>
    <a class="btn solid" href="/eclipse-x.html">Meet Eclipse-X</a>
    <a class="btn ghost" href="/">BlackCrown home</a>
  </div>
  <div class="foot">© 2026 BlackCrownVxJ LLC</div>
</main>

<!-- BlackCrown analytics beacon -->
<script>
(function(){
  var EP="https://admin.blackcrownvxj.com/api/track";
  function hit(e,k,x){try{new Image().src=EP+"?e="+e+"&k="+encodeURIComponent(k)+(x||"")+"&_="+Date.now();}catch(_){}}
  var d=(window.innerWidth<768)?"m":"d";
  var r=encodeURIComponent((document.referrer||"").slice(0,200));
  hit("visit","collective","&d="+d+"&r="+r);
  document.addEventListener("click",function(ev){
    var a=ev.target&&ev.target.closest?ev.target.closest("a[href]"):null;
    if(!a)return;
    var h=a.getAttribute("href")||"";
    if(/korvus\.industries/i.test(h))hit("click","korvus");
    else if(/blackcrown-intelligence\.com/i.test(h))hit("click","intelligence");
    else if(/discord\.(gg|com)/i.test(h))hit("click","collective");
  },true);
})();
</script>
</body>
</html>
